plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
//    id 'com.vanniktech.maven.publish.gradle.plugin'
    id "com.vanniktech.maven.publish" version "0.28.0"
    id 'signing'
    id 'kotlin-kapt'
    id "com.newrelic.agent.android"
//    id 'com.github.dcendents.android-maven'
}

def localProperties = new Properties()
localProperties.load(new FileInputStream(rootProject.file("local.properties")))
def newRelicToken = project.findProperty("newrelic.application_token") ?: ""

android {
    namespace 'com.github.legend295.fingerprintscanner'
    compileSdk 34

    defaultConfig {
        minSdk 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "NEW_RELIC_TOKEN", "\"${newRelicToken}\""
        }
        debug {
            buildConfigField "String", "NEW_RELIC_TOKEN", "\"${newRelicToken}\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    /* android.buildFeatures.dataBinding = true
     android.buildFeatures.viewBinding = true*/
    android.buildFeatures.buildConfig true
    buildFeatures {
        dataBinding = true
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.legend295'
                artifactId = 'FingerprintScannerSDK'
                version = '1.0.4'
            }
        }
    }
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
//    implementation files('libs/nb_android.jar')
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'com.google.code.gson:gson:2.10'

    // Declare the dependency for the Cloud FireStore library
    implementation 'com.google.firebase:firebase-firestore:25.1.0'
    implementation 'com.google.firebase:firebase-storage:21.0.0'
    implementation 'com.google.maps.android:android-maps-utils:2.0.3'

    implementation 'com.newrelic.agent.android:android-agent:7.6.2'

//    compileOnly 'net.java.dev.jna:jna:5.13.0'
}